name: build-python-wheels
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-wheels:
    name: Build wheels – ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            cibw_archs: x86_64
            extra_cmake_args: "-DED25519_AMD64_RADIX_64_24K=ON -DED25519_REF10=OFF"
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            cibw_archs: aarch64
            extra_cmake_args: ""
          - name: macos-universal
            os: macos-14
            cibw_archs: "x86_64 arm64"
            extra_cmake_args: ""
          - name: windows-x86_64
            os: windows-latest
            cibw_archs: AMD64
            extra_cmake_args: "-DVIRGIL_LIB_PYTHIA=OFF"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==2.21.3

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse wrappers/python
        env:
          CIBW_BUILD: "cp38-* cp39-* cp310-* cp311-* cp312-* cp313-*"
          CIBW_ARCHS: ${{ matrix.cibw_archs }}

          # -- Linux ----------------------------------------------------------
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux2014
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux2014
          CIBW_BEFORE_ALL_LINUX: >-
            yum install -y cmake3 &&
            ln -sf /usr/bin/cmake3 /usr/local/bin/cmake &&
            cd {project} &&
            cmake -Cconfigs/python-config.cmake
            -DCMAKE_BUILD_TYPE=Release
            -DCMAKE_INSTALL_PREFIX=wrappers/python/virgil_crypto_lib
            -DCMAKE_INSTALL_LIBDIR=_libs
            -DENABLE_CLANGFORMAT=OFF
            ${{ matrix.extra_cmake_args }}
            -Bbuild -H.
            && cmake --build build --target install -- -j$(nproc)
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >-
            auditwheel repair -w {dest_dir} {wheel}

          # -- macOS -----------------------------------------------------------
          CIBW_BEFORE_ALL_MACOS: >-
            cd {project} &&
            cmake -Cconfigs/python-config.cmake
            -DCMAKE_BUILD_TYPE=Release
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
            -DCMAKE_INSTALL_PREFIX=wrappers/python/virgil_crypto_lib
            -DCMAKE_INSTALL_LIBDIR=_libs
            -DENABLE_CLANGFORMAT=OFF
            -Bbuild -H.
            && cmake --build build --target install -- -j$(sysctl -n hw.physicalcpu)
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: >-
            delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}

          # -- Windows ---------------------------------------------------------
          CIBW_BEFORE_ALL_WINDOWS: >-
            cd /d {project} &&
            cmake -Cconfigs/python-config.cmake
            ${{ matrix.extra_cmake_args }}
            -DCMAKE_BUILD_TYPE=Release
            -DCMAKE_INSTALL_PREFIX=wrappers/python/virgil_crypto_lib
            -DCMAKE_INSTALL_LIBDIR=_libs
            -DCMAKE_INSTALL_BINDIR=_libs
            -DENABLE_CLANGFORMAT=OFF
            -Bbuild -H.
            && cmake --build build --target install --config Release

          # -- Testing (all platforms) -----------------------------------------
          CIBW_TEST_COMMAND: >-
            python -m unittest discover -s {package}/virgil_crypto_lib/tests -p "*_test.py"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.name }}
          path: ./wheelhouse/*.whl

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist
        run: python -m pip install build && python -m build --sdist wrappers/python --outdir dist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
