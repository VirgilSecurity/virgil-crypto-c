name: build-macos
on:
  push:
    branches:
      - "main"
      - "develop"
      - "release/**"
      - "hotfix/**"
jobs:
  build-macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Check Xcode
        run: |
          xcode-select -p
          xcodebuild -version
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Setup Python virtual environment
        run: python3 -m venv .venv
      - name: Configure toolchain
        run: |
          cmake --version
          python3 --version
      - name: Configure project
        run: |
          source .venv/bin/activate
          cmake -S. -Bbuild \
          -DVIRGIL_C_MT_TESTING=ON \
          -DENABLE_BENCHMARKING=ON \
          -DVIRGIL_PROGRAMS=ON
      - name: Build project
        run: cmake --build build -- -j$(sysctl -n hw.physicalcpu)
      - name: Run tests
        run: ctest --output-on-failure
        working-directory: build

  SPM:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Check Xcode
        run: |
          xcode-select -p
          xcodebuild -version
      - name: Check that SPM has correspond xcframeworks hash
        run: ./scripts/check_spm_xcframeworks.sh
      - name: Run SPM tests
        run: ./scripts/run_spm_tests_with_local_binaries.sh
