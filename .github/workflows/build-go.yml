name: Build and Test Go Wrapper

on:
  push:
    branches:
      - develop
      - main
      - 'release/**'
      - 'hotfix/**'
      - 'feature/**'
  pull_request:
    branches:
      - develop
      - main

jobs:
  build-and-test-linux:
    name: Go (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Setup Python virtual environment
        run: python3 -m venv .venv

      - name: Build native libraries
        run: |
          source .venv/bin/activate
          cmake -Cconfigs/go-config.cmake \
                -DVIRGIL_WRAP_GO=OFF \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="wrappers/go/pkg/linux_amd64" \
                -DENABLE_CLANGFORMAT=OFF \
                -DVIRGIL_POST_QUANTUM=ON \
                -DED25519_AMD64_RADIX_64_24K=ON \
                -DED25519_REF10=OFF \
                -Bbuild -S.
          cmake --build build --target install -j$(nproc)

      - name: Run Go tests
        working-directory: wrappers/go
        run: go test ./...

  build-and-test-macos:
    name: Go (macOS arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Setup Python virtual environment
        run: python3 -m venv .venv

      - name: Build native libraries
        run: |
          source .venv/bin/activate
          cmake -Cconfigs/go-config.cmake \
                -DVIRGIL_WRAP_GO=OFF \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_OSX_ARCHITECTURES=arm64 \
                -DCMAKE_INSTALL_PREFIX="wrappers/go/pkg/darwin_arm64" \
                -DENABLE_CLANGFORMAT=OFF \
                -DVIRGIL_POST_QUANTUM=ON \
                -Bbuild -S.
          cmake --build build --target install -j$(sysctl -n hw.physicalcpu)

      - name: Run Go tests
        working-directory: wrappers/go
        run: go test ./...
