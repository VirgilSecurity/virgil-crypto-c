name: Build Go

on:
  push:
    branches:
      - develop
      - main
      - 'release/**'
      - 'hotfix/**'
      - 'feature/**'
  pull_request:
    branches:
      - develop
      - main
  workflow_call:
    inputs:
      upload_artifacts:
        description: 'Upload built libraries as workflow artifacts for release'
        type: boolean
        default: false
      ref:
        description: 'Branch or SHA to check out (empty = calling workflow ref)'
        type: string
        default: ''
      version:
        description: 'Version string to bumpver before building (empty = skip bump)'
        type: string
        default: ''

env:
  GO_VERSION: '1.21'
  PYTHON_VERSION: '3.11'

jobs:
  build:
    name: Go (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux_amd64
            runner: ubuntu-latest
            cmake_extra: >-
              -DED25519_AMD64_RADIX_64_24K=ON
              -DED25519_REF10=OFF
            run_tests: true
            expected_elf_arch: X86-64

          - target: linux_arm64
            runner: ubuntu-latest
            cmake_extra: >-
              -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc
              -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++
              -DCMAKE_SYSTEM_NAME=Linux
              -DCMAKE_SYSTEM_PROCESSOR=aarch64
            cross_packages: gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
            run_tests: false
            expected_elf_arch: AArch64

          - target: darwin_amd64
            runner: macos-latest
            cmake_extra: >-
              -DCMAKE_OSX_ARCHITECTURES=x86_64
            run_tests: false

          - target: darwin_arm64
            runner: macos-latest
            cmake_extra: >-
              -DCMAKE_OSX_ARCHITECTURES=arm64
            run_tests: true

          - target: windows_amd64
            runner: windows-latest
            cmake_extra: >-
              -G "MinGW Makefiles"
            run_tests: true
            expected_pe_machine: IMAGE_FILE_MACHINE_AMD64

          # MSYS2 CLANGARM64 supplies the aarch64-w64-mingw32 GNU-ABI
          # toolchain. The image's preinstalled gcc is niXman mingw-builds,
          # x86_64/i686 only, running under emulation — it cannot emit
          # aarch64 objects, so it must not be picked up as CC.
          - target: windows_arm64
            runner: windows-11-arm
            cmake_extra: >-
              -G Ninja
            msys2: true
            shell: msys2 {0}
            run_tests: true
            expected_pe_machine: IMAGE_FILE_MACHINE_ARM64

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Java (for bumpver Maven step)
        if: inputs.version != ''
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Bump version (release builds only)
        if: inputs.version != ''
        shell: bash
        run: ./scripts/bumpver.sh "${{ inputs.version }}"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Go
        if: matrix.run_tests
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install cross-compilation toolchain
        if: matrix.cross_packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.cross_packages }}

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      # path-type: inherit keeps the Windows PATH visible inside the MSYS2
      # shell, so python3, go, and java from the setup-* actions above still
      # resolve in the build and test steps.
      - name: Setup MSYS2 CLANGARM64 toolchain
        if: matrix.msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          path-type: inherit
          update: false
          install: >-
            mingw-w64-clang-aarch64-toolchain
            mingw-w64-clang-aarch64-cmake
            mingw-w64-clang-aarch64-ninja

      # Steps do not inherit each other's shell environment, so CC/CXX must go
      # through GITHUB_ENV or the build step falls back to the emulated
      # x86_64 gcc and silently produces wrong-arch archives.
      - name: Export aarch64 toolchain
        if: matrix.msys2
        shell: msys2 {0}
        run: |
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"

      - name: Toolchain sanity probe
        if: matrix.msys2
        shell: msys2 {0}
        run: |
          set -x
          command -v clang
          clang -dumpmachine
          cmake --version
          ninja --version
          llvm-readobj --version
          python3 --version
          go env GOOS GOARCH
          set +x
          # Match the GNU-ABI triple specifically. path-type: inherit makes the
          # Windows PATH visible here, so a native aarch64-pc-windows-msvc clang
          # could otherwise satisfy a bare aarch64* match and produce MSVC-ABI
          # objects that break the lib<name>.a / -l<name> cgo contract.
          triple=$(clang -dumpmachine)
          case "$triple" in
            aarch64*-w64-*|aarch64*-mingw*)
              echo "OK: compiler targets $triple" ;;
            *)
              echo "ERROR: expected an aarch64 GNU-ABI (w64-mingw32) target, got '$triple'"
              exit 1 ;;
          esac
          # Assert GOARCH too, not just print it: an emulated x64 Go would
          # select the windows,amd64 cgo constraints and fail later as an
          # opaque link error instead of here.
          if command -v go >/dev/null 2>&1; then
            goarch=$(go env GOARCH)
            [ "$goarch" = arm64 ] || {
              echo "ERROR: expected GOARCH=arm64, got '$goarch'"; exit 1; }
            echo "OK: GOARCH=$goarch"
          fi

      - name: Setup Python virtual environment
        if: runner.os != 'Windows'
        run: python3 -m venv .venv

      - name: Build native libraries
        shell: ${{ matrix.shell || 'bash' }}
        run: |
          cmake -Cconfigs/go-config.cmake \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/wrappers/go/pkg/${{ matrix.target }}" \
                -DENABLE_CLANGFORMAT=OFF \
                -DVIRGIL_POST_QUANTUM=ON \
                ${{ matrix.cmake_extra }} \
                -Bbuild -S.
          cmake --build build --target install -j$(nproc 2>/dev/null || sysctl -n hw.physicalcpu 2>/dev/null || echo 4)

      - name: Verify binary architecture
        if: matrix.expected_elf_arch != ''
        shell: bash
        run: |
          expected="${{ matrix.expected_elf_arch }}"
          failed=0
          for lib in \
              wrappers/go/pkg/${{ matrix.target }}/lib/libvsc_foundation.a \
              wrappers/go/pkg/${{ matrix.target }}/lib/libvsc_ratchet.a \
              wrappers/go/pkg/${{ matrix.target }}/lib/libmlkem768.a \
              wrappers/go/pkg/${{ matrix.target }}/lib/libfalcon.a \
              wrappers/go/pkg/${{ matrix.target }}/lib/libmbedcrypto.a; do
            actual=$(readelf -h "$lib" 2>&1 | awk '/Machine:/{print $NF; exit}')
            if [ "$actual" != "$expected" ]; then
              echo "ERROR: $lib Machine type '$actual', expected '$expected'"
              failed=1
            else
              echo "OK: $lib ($actual)"
            fi
          done
          [ $failed -eq 0 ] || { echo "Cross-compilation misconfiguration detected."; exit 1; }

      # readelf cannot read PE/COFF, so Windows targets need their own check.
      # llvm-readobj reads .a archive members directly and prints the machine
      # as the full constant, e.g. "Machine: IMAGE_FILE_MACHINE_ARM64 (0xAA64)".
      - name: Verify binary architecture (PE)
        if: matrix.expected_pe_machine != ''
        shell: ${{ matrix.shell || 'bash' }}
        run: |
          if ! command -v llvm-readobj >/dev/null 2>&1; then
            echo "ERROR: llvm-readobj not found on PATH; cannot verify PE architecture."
            exit 1
          fi
          expected="${{ matrix.expected_pe_machine }}"
          libdir="wrappers/go/pkg/${{ matrix.target }}/lib"
          # Glob every installed archive rather than a hand-maintained list:
          # the whole install prefix is uploaded and committed, so anything
          # left unchecked can ship wrong-arch.
          shopt -s nullglob
          libs=("$libdir"/*.a)
          shopt -u nullglob
          if [ ${#libs[@]} -eq 0 ]; then
            echo "ERROR: no .a archives found under $libdir"
            exit 1
          fi
          failed=0
          for lib in "${libs[@]}"; do
            # Keep llvm-readobj's exit status and stderr out of the parsed
            # stream: folding them in lets a partial read look like a clean
            # single-architecture result.
            if ! out=$(llvm-readobj --file-headers "$lib" 2>/dev/null); then
              echo "ERROR: llvm-readobj failed on $lib"
              failed=1
              continue
            fi
            actual=$(printf '%s\n' "$out" | awk '/Machine:/{print $2}' | sort -u | tr '\n' ' ')
            if [ -z "$actual" ]; then
              echo "ERROR: $lib reported no Machine headers"
              failed=1
              continue
            fi
            case "$actual" in
              "$expected "|"$expected")
                echo "OK: $lib ($expected)" ;;
              *)
                echo "ERROR: $lib Machine '$actual', expected '$expected'"
                failed=1 ;;
            esac
          done
          echo "Verified ${#libs[@]} archives against $expected."
          [ $failed -eq 0 ] || { echo "Wrong-architecture archives detected."; exit 1; }

      - name: Run Go tests
        if: matrix.run_tests
        shell: ${{ matrix.shell || 'bash' }}
        working-directory: wrappers/go
        run: go test ./...

      - name: Upload built libraries
        if: inputs.upload_artifacts
        uses: actions/upload-artifact@v4
        with:
          name: go-libs-${{ matrix.target }}
          path: wrappers/go/pkg/${{ matrix.target }}/
          retention-days: 1
