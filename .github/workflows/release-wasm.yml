name: Release WASM

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'

jobs:
  build-and-test:
    uses: ./.github/workflows/build-wasm.yml
    with:
      upload_artifacts: true

  is-prerelease:
    name: Check if pre-release
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - name: Detect pre-release tag
        id: check
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-.+ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  publish-npm:
    name: Publish to npm
    if: needs.is-prerelease.outputs.prerelease == 'false'
    needs: [build-and-test, is-prerelease]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Enable OIDC auth (remove token placeholder)
        run: sed -i '/\/\/registry.npmjs.org\/:_authToken/d' ~/.npmrc

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: wasm-dist
          path: wrappers/wasm/dist/

      - name: Publish to npm
        working-directory: wrappers/wasm
        run: npm publish --provenance --access public

  publish-npm-prerelease:
    name: Publish pre-release to npm
    if: needs.is-prerelease.outputs.prerelease == 'true'
    needs: [build-and-test, is-prerelease]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Enable OIDC auth (remove token placeholder)
        run: sed -i '/\/\/registry.npmjs.org\/:_authToken/d' ~/.npmrc

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: wasm-dist
          path: wrappers/wasm/dist/

      - name: Publish pre-release to npm
        working-directory: wrappers/wasm
        run: npm publish --provenance --access public --tag next
