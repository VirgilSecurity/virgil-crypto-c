name: Release WASM

on:
  workflow_call:
    inputs:
      version:
        description: 'Version string (e.g. 0.19.0-rc.1)'
        type: string
        required: true
      ref:
        description: 'Git ref to build from (e.g. refs/tags/v0.19.0-rc.1)'
        type: string
        required: true

jobs:
  build-and-test:
    uses: ./.github/workflows/build-wasm.yml
    with:
      upload_artifacts: true
      ref: ${{ inputs.ref }}

  is-prerelease:
    name: Check if pre-release
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - name: Detect pre-release tag
        id: check
        run: |
          TAG="v${{ inputs.version }}"
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-.+ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  publish-npm:
    name: Publish to npm
    if: needs.is-prerelease.outputs.prerelease == 'false'
    needs: [build-and-test, is-prerelease]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: wasm-dist
          path: wrappers/wasm/dist/

      - name: Publish to npm
        working-directory: wrappers/wasm
        run: npm publish --provenance --access public

  publish-npm-prerelease:
    name: Publish pre-release to npm
    if: needs.is-prerelease.outputs.prerelease == 'true'
    needs: [build-and-test, is-prerelease]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: wasm-dist
          path: wrappers/wasm/dist/

      - name: Publish pre-release to npm
        working-directory: wrappers/wasm
        run: npm publish --provenance --access public --tag next
