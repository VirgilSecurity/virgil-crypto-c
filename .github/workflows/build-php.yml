name: Build PHP

on:
  workflow_call: {}
  push:
    branches:
      - develop
      - main
      - 'release/**'
      - 'hotfix/**'
      - 'feature/**'
  pull_request:
    branches:
      - develop
      - main

jobs:
  build-windows-php:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.2", "8.3", "8.4"]
        arch: [x86_64]
        include:
          - arch: x86_64
            arch-short: x64
    name: Windows PHP ${{ matrix.php-version }} (${{ matrix.arch }})
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Setup Python virtual environment
        shell: pwsh
        run: python -m venv .venv

      - name: Check toolchain versions
        run: |
          cmake --version
          python3 --version

      - name: Install MSVC Dev Cmd
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Install PHP ${{ matrix.php-version }}
        id: setup-php
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
        env:
          phpts: ts

      - name: Check PHP Version
        run: php -v

      - name: Download PHP development pack
        id: develpack
        shell: pwsh
        run: |
          $arch = "${{ matrix.arch-short }}"
          $requested_ver = "${{ matrix.php-version }}"
          $runtime_ver = "${{ steps.setup-php.outputs.php-version }}"

          $php_devel_zip = "php-devel.zip"

          # Devel packs for some patch versions can be moved to the archives directory.
          $bases = @(
            "https://windows.php.net/downloads/releases",
            "https://windows.php.net/downloads/releases/archives"
          )

          function Get-Candidates([string]$ver) {
            $variants = @(
              @{ nts = $false; vs = "vs17" },
              @{ nts = $false; vs = "vs16" },
              @{ nts = $true;  vs = "vs17" },
              @{ nts = $true;  vs = "vs16" }
            )

            $items = @()
            foreach ($base in $bases) {
              foreach ($v in $variants) {
                $ntsPart = if ($v.nts) { "-nts" } else { "" }
                $file = "php-devel-pack-$ver$ntsPart-Win32-$($v.vs)-$arch.zip"
                $items += @{ url = "$base/$file"; ver = $ver; vs = $v.vs; nts = $v.nts }
              }
            }
            return $items
          }

          function Get-VersionFallbacks([string]$ver) {
            # For example, if runtime is 8.2.30, try: 8.2.30, 8.2.29, 8.2.28.
            if ($ver -notmatch '^(\d+)\.(\d+)\.(\d+)$') {
              return @($ver)
            }

            $maj = [int]$Matches[1]
            $min = [int]$Matches[2]
            $pat = [int]$Matches[3]

            $out = @()
            for ($i = 0; $i -lt 3; $i++) {
              $p = $pat - $i
              if ($p -lt 0) { break }
              $out += "$maj.$min.$p"
            }
            return $out
          }

          # Try patch fallbacks based on the actually installed PHP runtime.
          $versionsToTry = @(Get-VersionFallbacks $runtime_ver)

          # If the matrix requested a specific patch version, also try it (and its patch fallbacks).
          if (($requested_ver -ne $runtime_ver) -and ($requested_ver -match '^\d+\.\d+\.\d+$')) {
            $versionsToTry += (Get-VersionFallbacks $requested_ver)
          }

          # De-duplicate while preserving order.
          $seen = @{}
          $versionsToTry = @($versionsToTry | Where-Object { if ($seen.ContainsKey($_)) { $false } else { $seen[$_] = $true; $true } })

          $chosen = $null
          foreach ($ver in $versionsToTry) {
            foreach ($c in (Get-Candidates $ver)) {
              try {
                Write-Host "Trying $($c.url)"
                Invoke-WebRequest -Uri $c.url -OutFile $php_devel_zip -ErrorAction Stop
                $chosen = $c
                break
              } catch {
                # try next
              }
            }
            if ($chosen) { break }
          }

          if (-not $chosen) {
            throw "Could not download a PHP devel pack for runtime '$runtime_ver' nor requested '$requested_ver' (tried versions: $($versionsToTry -join ', '); tried vs17/vs16 and ts/nts; tried releases and releases/archives)."
          }

          Expand-Archive -Path $php_devel_zip -DestinationPath "c:\\tools" -Force
          Remove-Item -Path $php_devel_zip

          $ntsFolder = if ($chosen.nts) { "-nts" } else { "" }
          $php_devel_home = "C:\\tools\\php-$($chosen.ver)$ntsFolder-devel-$($chosen.vs)-$arch"

          if (-not (Test-Path $php_devel_home)) {
            throw "Expected devel folder '$php_devel_home' was not created by the zip."
          }

          "php_devel_home=$php_devel_home" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "php_devel_pack_url=$($chosen.url)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Using PHP devel pack: $($chosen.url)"
          Write-Host "PHP_DEVEL_HOME: $php_devel_home"

      - name: Checkout project
        uses: actions/checkout@v6

      - name: Configure project
        shell: cmd
        run: |
          call .venv\Scripts\activate.bat
          cmake -G"NMake Makefiles" ^
          -C"configs\\php-config.cmake" ^
          -DPHP_DEVEL_HOME="${{ steps.develpack.outputs.php_devel_home }}" ^
          -DCMAKE_BUILD_TYPE=Release ^
          -DVIRGIL_PACKAGE_PLATFORM_ARCH="${{ matrix.arch }}" ^
          -DVIRGIL_PACKAGE_PLATFORM=windows ^
          -DVIRGIL_PACKAGE_LANGUAGE_VERSION="${{ matrix.php-version }}" ^
          -DCPACK_OUTPUT_FILE_PREFIX=php ^
          -DENABLE_CLANGFORMAT=OFF ^
          -Bbuild -S.

      - name: Build project
        run: cmake --build build --parallel $NUMBER_OF_PROCESSORS

      - name: Package project
        working-directory: build
        run: cpack

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: php-windows-${{ matrix.arch }}-php${{ steps.setup-php.outputs.php-version }}
          path: build/php/*.zip
          if-no-files-found: error
          retention-days: 7

  build-linux-php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.2", "8.3", "8.4"]
        arch: [x86_64]
    name: Linux PHP ${{ matrix.php-version }} (${{ matrix.arch }})
    steps:
      - name: Install PHP ${{ matrix.php-version }}
        id: setup-php
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}

      - name: Check PHP Version
        run: php -v

      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Setup Python virtual environment
        run: python3 -m venv .venv

      - name: Configure toolchain
        run: |
          cmake --version
          python3 --version

      - name: Configure project
        run: |
          source .venv/bin/activate
          cmake -Cconfigs/php-config.cmake \
              -DCMAKE_BUILD_TYPE=Release \
              -DVIRGIL_PACKAGE_PLATFORM_ARCH=${{ matrix.arch }} \
              -DVIRGIL_PACKAGE_PLATFORM=linux \
              -DVIRGIL_PACKAGE_LANGUAGE_VERSION=${{ matrix.php-version }} \
              -DCPACK_OUTPUT_FILE_PREFIX=php \
              -DENABLE_CLANGFORMAT=OFF \
              -DED25519_REF10=OFF -DED25519_AMD64_RADIX_64_24K=ON \
              -Bbuild -S.

      - name: Build project
        run: cmake --build build -- -j$(nproc)

      - name: Test project
        working-directory: build
        run: ctest --verbose

      - name: Package project
        working-directory: build
        run: cpack

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: php-linux-${{ matrix.arch }}-php${{ steps.setup-php.outputs.php-version }}
          path: build/php/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  build-macos-php:
    runs-on: macos-26
    if: |
      startsWith(github.ref, 'refs/tags/') ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/develop' ||
      startsWith(github.ref, 'refs/heads/release/') ||
      startsWith(github.ref, 'refs/heads/hotfix/')
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.2", "8.3", "8.4"]
        arch: [x86_64, arm64]
        include:
          - arch: x86_64
            optimizations: -DED25519_REF10=OFF -DED25519_AMD64_RADIX_64_24K=ON
            should_test: false
          - arch: arm64
            optimizations: -DED25519_REF10=ON
            should_test: true
    name: macOS PHP ${{ matrix.php-version }} (${{ matrix.arch }})
    steps:
      - name: Install PHP ${{ matrix.php-version }}
        id: setup-php
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}

      - name: Check PHP Version
        run: php -v

      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Setup Python virtual environment
        run: python3 -m venv .venv

      - name: Configure toolchain
        run: |
          cmake --version
          python3 --version

      - name: Configure project
        run: |
          source .venv/bin/activate
          cmake -Cconfigs/php-config.cmake \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
              -DVIRGIL_PACKAGE_PLATFORM_ARCH=${{ matrix.arch }} \
              -DVIRGIL_PACKAGE_PLATFORM=macos \
              -DVIRGIL_PACKAGE_LANGUAGE_VERSION=${{ matrix.php-version }} \
              -DCPACK_OUTPUT_FILE_PREFIX=php \
              -DENABLE_CLANGFORMAT=OFF \
              ${{ matrix.optimizations }} \
              -Bbuild -S.

      - name: Build project
        run: cmake --build build -- -j$(sysctl -n hw.physicalcpu)

      - name: Test project
        if: ${{ matrix.should_test }}
        working-directory: build
        run: ctest --verbose

      - name: Package project
        working-directory: build
        run: cpack

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: php-macos-${{ matrix.arch }}-php${{ steps.setup-php.outputs.php-version }}
          path: build/php/*.tar.gz
          if-no-files-found: error
          retention-days: 7
