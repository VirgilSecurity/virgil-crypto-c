name: Build Python
on:
  push:
    branches:
      - develop
      - main
      - 'release/**'
      - 'hotfix/**'
      - 'feature/**'
  pull_request:
    branches:
      - develop
      - main
  workflow_call:

jobs:
  build-wheels:
    name: Build wheels – ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            cibw_archs: x86_64
            extra_cmake_args: "-DED25519_AMD64_RADIX_64_24K=ON -DED25519_REF10=OFF"
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            cibw_archs: aarch64
            extra_cmake_args: ""
          - name: macos-universal
            os: macos-14
            cibw_archs: "x86_64 arm64"
            extra_cmake_args: ""
          - name: windows-x86_64
            os: windows-latest
            cibw_archs: AMD64
            extra_cmake_args: "-DVIRGIL_LIB_PYTHIA=OFF"

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==2.21.3

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse wrappers/python
        env:
          CIBW_ARCHS: ${{ matrix.cibw_archs }}
          CIBW_SKIP: "pp* *-musllinux_*"

          # -- Test configuration (runs inside each build container) -----------
          CIBW_TEST_COMMAND: >-
            python -c "from virgil_crypto_lib.foundation.sha256 import Sha256; h = Sha256().hash(bytearray(b'test')); assert len(h) == 32, 'SHA-256 smoke test failed'; print('smoke test OK')"

          # -- Linux ----------------------------------------------------------
          CIBW_ENVIRONMENT_LINUX: >-
            LD_LIBRARY_PATH={project}/wrappers/python/virgil_crypto_lib/_libs
          CIBW_BEFORE_ALL_LINUX: >-
            pip install cmake &&
            yum install -y gcc-c++ &&
            cd {project} &&
            cmake -Cconfigs/python-config.cmake
            -DCMAKE_BUILD_TYPE=Release
            -DCMAKE_INSTALL_PREFIX=wrappers/python/virgil_crypto_lib
            -DCMAKE_INSTALL_LIBDIR=_libs
            -DENABLE_CLANGFORMAT=OFF
            ${{ matrix.extra_cmake_args }}
            -Bbuild -H.
            && cmake --build build --target install -- -j$(nproc)
            && cp wrappers/python/virgil_crypto_lib/_libs/lib*.so /usr/local/lib/
            && ldconfig

          # -- macOS -----------------------------------------------------------
          CIBW_ENVIRONMENT_MACOS: >-
            DYLD_LIBRARY_PATH={project}/wrappers/python/virgil_crypto_lib/_libs
          CIBW_BEFORE_ALL_MACOS: >-
            cd {project} &&
            cmake -Cconfigs/python-config.cmake
            -DCMAKE_BUILD_TYPE=Release
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
            -DCMAKE_INSTALL_PREFIX=wrappers/python/virgil_crypto_lib
            -DCMAKE_INSTALL_LIBDIR=_libs
            -DCMAKE_INSTALL_RPATH=@loader_path
            -DENABLE_CLANGFORMAT=OFF
            -Bbuild -H.
            && cmake --build build --target install -- -j$(sysctl -n hw.physicalcpu)

          # -- Windows ---------------------------------------------------------
          CIBW_BEFORE_ALL_WINDOWS: >-
            cd /d {project} &&
            cmake -Cconfigs/python-config.cmake
            ${{ matrix.extra_cmake_args }}
            -DCMAKE_BUILD_TYPE=Release
            -DCMAKE_INSTALL_PREFIX=wrappers/python/virgil_crypto_lib
            -DCMAKE_INSTALL_LIBDIR=_libs
            -DCMAKE_INSTALL_BINDIR=_libs
            -DENABLE_CLANGFORMAT=OFF
            -Bbuild -H.
            && cmake --build build --target install --config Release

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.name }}
          path: ./wheelhouse/*.whl

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build sdist
        run: python -m pip install build && python -m build --sdist wrappers/python --outdir dist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # ---------------------------------------------------------------------------
  #   Test wheels — install from built artifacts and verify on each platform
  # ---------------------------------------------------------------------------
  test-wheels:
    name: Test wheels – ${{ matrix.name }}
    needs: build-wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            artifact: wheels-linux-x86_64
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            artifact: wheels-linux-aarch64
          - name: macos-arm64
            os: macos-14
            artifact: wheels-macos-universal
          - name: windows-x86_64
            os: windows-latest
            artifact: wheels-windows-x86_64

    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: wheelhouse

      - name: Install wheel
        shell: bash
        run: |
          pip install --find-links wheelhouse virgil-crypto-lib

      - name: Smoke test — import and basic crypto
        shell: bash
        run: |
          python -c "
          import virgil_crypto_lib
          print('version:', virgil_crypto_lib.__version__)

          from virgil_crypto_lib.foundation.sha256 import Sha256
          digest = Sha256().hash(bytearray(b'hello'))
          assert len(digest) == 32, f'Expected 32 bytes, got {len(digest)}'
          print('SHA-256 OK')

          from virgil_crypto_lib.foundation.kdf1 import Kdf1
          print('KDF1 import OK')

          from virgil_crypto_lib.foundation.key_provider import KeyProvider
          kp = KeyProvider()
          kp.setup_defaults()
          print('KeyProvider setup OK')

          print('All smoke tests passed')
          "
