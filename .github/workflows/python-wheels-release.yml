name: python-wheels-release
on:
  push:
    tags:
      - "v*"

jobs:
  build-and-test:
    uses: ./.github/workflows/python-wheels-build.yml

  is-prerelease:
    name: Check if pre-release
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - name: Detect pre-release tag
        id: check
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # A tag with a hyphen after the version (e.g. v0.17.3-rc1, v1.0.0-alpha1)
          # indicates a pre-release
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-.+ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  publish-pypi:
    name: Publish to PyPI
    if: needs.is-prerelease.outputs.prerelease == 'false'
    needs: [build-and-test, is-prerelease]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/virgil-crypto-lib
    permissions:
      id-token: write
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-testpypi:
    name: Publish to TestPyPI
    if: needs.is-prerelease.outputs.prerelease == 'true'
    needs: [build-and-test, is-prerelease]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/virgil-crypto-lib
    permissions:
      id-token: write
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
