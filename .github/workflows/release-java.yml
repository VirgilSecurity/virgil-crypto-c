name: Release Java

on:
  push:
    tags:
      - 'v*.*.*'           # Release tags (v1.2.3)
      - 'v*.*.*-rc*'       # Release candidate tags (v1.2.3-rc1)
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release'
        required: true
        type: string

jobs:
  build:
    name: Build Binaries
    uses: ./.github/workflows/build-java.yml

  publish-jvm-release:
    name: Publish JVM Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'maven'
          server-id: central
          server-username: OSSRH_USERNAME
          server-password: OSSRH_PASSWORD

      - name: Download all JVM binaries
        uses: actions/download-artifact@v4
        with:
          pattern: java-binaries-*
          path: wrappers/java/binaries/
          merge-multiple: false

      - name: Restructure binaries
        run: |
          cd wrappers/java/binaries
          mkdir -p linux macos_x86_64 macos_arm64 windows
          [ -d java-binaries-linux ] && mv java-binaries-linux/lib linux/ || true
          [ -d java-binaries-macos-x86_64 ] && mv java-binaries-macos-x86_64/lib macos_x86_64/ || true
          [ -d java-binaries-macos-arm64 ] && mv java-binaries-macos-arm64/lib macos_arm64/ || true
          [ -d java-binaries-windows ] && mv java-binaries-windows/lib windows/ || true
          rm -rf java-binaries-*

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --list-secret-keys --keyid-format LONG

      - name: Verify version matches tag
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        working-directory: wrappers/java
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG=${{ inputs.tag }}
          else
            TAG=${GITHUB_REF#refs/tags/}
          fi
          TAG_VERSION=${TAG#v}
          # Use Maven to evaluate the effective project version (more robust than grepping XML).
          POM_VERSION=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout | tr -d '[:space:]')
          echo "Tag version: $TAG_VERSION"
          echo "POM version: $POM_VERSION"
          # Remove -SNAPSHOT suffix for comparison
          POM_VERSION_BASE=${POM_VERSION%-SNAPSHOT}
          if [ "$TAG_VERSION" != "$POM_VERSION_BASE" ]; then
            echo "ERROR: Tag version ($TAG_VERSION) doesn't match POM version ($POM_VERSION_BASE)"
            exit 1
          fi

      - name: Deploy to Maven Central
        working-directory: wrappers/java
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          ./mvnw clean deploy \
            -P foundation,phe,pythia,ratchet,release \
            -Dgpg.passphrase="${GPG_PASSPHRASE}" \
            -DskipTests

  publish-android-release:
    name: Publish Android Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'  # Android requires Java 17 for AGP 8+
          cache: 'gradle'

      - name: Download all Android binaries
        uses: actions/download-artifact@v4
        with:
          pattern: android-binaries-*
          path: wrappers/java/binaries/android/lib/
          merge-multiple: false

      - name: Restructure Android binaries
        run: |
          cd wrappers/java/binaries/android/lib
          mkdir -p x86 x86_64 armeabi-v7a arm64-v8a
          [ -d android-binaries-x86 ] && mv android-binaries-x86/* x86/ || true
          [ -d android-binaries-x86_64 ] && mv android-binaries-x86_64/* x86_64/ || true
          [ -d android-binaries-armeabi-v7a ] && mv android-binaries-armeabi-v7a/* armeabi-v7a/ || true
          [ -d android-binaries-arm64-v8a ] && mv android-binaries-arm64-v8a/* arm64-v8a/ || true
          rm -rf android-binaries-*
          ls -la

      - name: Verify version matches tag
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        working-directory: wrappers/java/android
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG=${{ inputs.tag }}
          else
            TAG=${GITHUB_REF#refs/tags/}
          fi
          TAG_VERSION=${TAG#v}
          # Ask Gradle for the effective project version (no parsing of 'properties' output).
          GRADLE_VERSION=$(./gradlew -q printVersion | tr -d '[:space:]')
          if [ -z "$GRADLE_VERSION" ]; then
            echo "ERROR: Could not extract Gradle version via ./gradlew printVersion"
            exit 1
          fi
          echo "Tag version: $TAG_VERSION"
          echo "Gradle version: $GRADLE_VERSION"
          GRADLE_VERSION_BASE=${GRADLE_VERSION%-SNAPSHOT}
          if [ "$TAG_VERSION" != "$GRADLE_VERSION_BASE" ]; then
            echo "ERROR: Tag version ($TAG_VERSION) doesn't match Gradle version ($GRADLE_VERSION_BASE)"
            exit 1
          fi

      - name: Verify Central bundle publish tasks exist
        working-directory: wrappers/java/android
        run: |
          ./gradlew -q help --task :common:publishReleasePublicationToCentralBundleRepository
          ./gradlew -q help --task :foundation:publishReleasePublicationToCentralBundleRepository
          ./gradlew -q help --task :phe:publishReleasePublicationToCentralBundleRepository
          ./gradlew -q help --task :pythia:publishReleasePublicationToCentralBundleRepository
          ./gradlew -q help --task :ratchet:publishReleasePublicationToCentralBundleRepository

      - name: Publish Android artifacts to local bundle repo
        working-directory: wrappers/java/android
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          rm -rf build/central-bundle-repo build/central-bundle.zip
          ./gradlew \
            :common:publishReleasePublicationToCentralBundleRepository \
            :foundation:publishReleasePublicationToCentralBundleRepository \
            :phe:publishReleasePublicationToCentralBundleRepository \
            :pythia:publishReleasePublicationToCentralBundleRepository \
            :ratchet:publishReleasePublicationToCentralBundleRepository \
            -PsigningKey="${SIGNING_KEY}" \
            -PsigningPassword="${SIGNING_PASSWORD}" \
            --no-daemon \
            --stacktrace

      - name: Validate bundle repo contains POMs
        working-directory: wrappers/java/android
        run: |
          test -d build/central-bundle-repo

          echo "Top-level bundle repo structure:"
          find build/central-bundle-repo -maxdepth 6 -type d | head -n 200

          echo "POM files present (first 100):"
          find build/central-bundle-repo -type f -name '*.pom' | sort | head -n 100

          # Central requires that each artifact directory ultimately contains a POM.
          for a in common-android foundation-android phe-android pythia-android ratchet-android; do
            echo "Files directly under artifact dir (${a}):"
            find "build/central-bundle-repo/com/virgilsecurity/crypto/${a}" -maxdepth 1 -type f 2>/dev/null | sort || true
            COUNT=$(find "build/central-bundle-repo/com/virgilsecurity/crypto/${a}" -type f -name '*.pom' 2>/dev/null | wc -l | tr -d '[:space:]')
            echo "POM count for ${a}: ${COUNT}"
            if [ "${COUNT}" = "0" ]; then
              echo "ERROR: No .pom found for ${a} in bundle repo."
              find "build/central-bundle-repo/com/virgilsecurity/crypto/${a}" -maxdepth 4 -type f 2>/dev/null | head -n 200 || true
              exit 1
            fi
          done

      - name: Build Central Portal bundle zip
        working-directory: wrappers/java/android
        run: |
          test -d build/central-bundle-repo

          # Central Portal bundles should not include repository metadata files that some tools generate.
          # These are normally served by repository managers and may cause validation failures.
          find build/central-bundle-repo -type f -name 'maven-metadata.xml*' -delete
          find build/central-bundle-repo -type f -name '*.module*' -delete

          echo "POM files generated:"
          POM_COUNT=$(find build/central-bundle-repo -type f -name '*.pom' | wc -l | tr -d '[:space:]')
          echo "${POM_COUNT}"
          if [ "${POM_COUNT}" = "0" ]; then
            echo "ERROR: No .pom files found in build/central-bundle-repo; Central Portal requires POMs for each artifact."
            find build/central-bundle-repo -maxdepth 6 -type f | head -n 200
            exit 1
          fi

          # Central Portal expects a Maven-repository-layout archive with checksums.
          while IFS= read -r -d '' file; do
            md5sum "$file" | awk '{print $1}' > "$file.md5"
            sha1sum "$file" | awk '{print $1}' > "$file.sha1"
          done < <(find build/central-bundle-repo -type f \
            ! -name '*.asc' \
            ! -name '*.md5' \
            ! -name '*.sha1' \
            -print0)

          (cd build/central-bundle-repo && zip -q -r ../central-bundle.zip .)
          ls -la build/central-bundle.zip

      - name: Upload Central bundle (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: central-portal-bundle-android
          path: wrappers/java/android/build/central-bundle.zip

      - name: Upload Central bundle repo (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: central-portal-bundle-repo-android
          path: wrappers/java/android/build/central-bundle-repo/

      - name: Upload bundle to Sonatype Central Portal
        working-directory: wrappers/java/android
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
        run: |
          if [ -z "${OSSRH_USERNAME}" ] || [ -z "${OSSRH_PASSWORD}" ]; then
            echo "ERROR: Missing Sonatype Central Portal token. Expected OSSRH_USERNAME/OSSRH_PASSWORD secrets to contain Portal token username/password."
            exit 1
          fi

          CENTRAL_BEARER=$(printf "%s:%s" "${OSSRH_USERNAME}" "${OSSRH_PASSWORD}" | base64 | tr -d '\n')
          DEPLOYMENT_ID=$(curl -sS \
            --fail \
            --header "Authorization: Bearer ${CENTRAL_BEARER}" \
            --form "bundle=@build/central-bundle.zip" \
            "https://central.sonatype.com/api/v1/publisher/upload?publishingType=AUTOMATIC&name=${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}")

          if [ -z "${DEPLOYMENT_ID}" ]; then
            echo "ERROR: Central Portal did not return a deployment ID"
            exit 1
          fi
          echo "Central deployment id: ${DEPLOYMENT_ID}"
          echo "DEPLOYMENT_ID=${DEPLOYMENT_ID}" >> "$GITHUB_ENV"

      - name: Wait for Central Portal publish
        working-directory: wrappers/java/android
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
        run: |
          CENTRAL_BEARER=$(printf "%s:%s" "${OSSRH_USERNAME}" "${OSSRH_PASSWORD}" | base64 | tr -d '\n')

          for i in $(seq 1 60); do
            STATUS_JSON=$(curl -sS --fail --request POST \
              --header "Authorization: Bearer ${CENTRAL_BEARER}" \
              "https://central.sonatype.com/api/v1/publisher/status?id=${DEPLOYMENT_ID}")
            STATE=$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("deploymentState",""))' <<<"${STATUS_JSON}")
            echo "Central state: ${STATE}"

            if [ "${STATE}" = "PUBLISHED" ]; then
              exit 0
            fi
            if [ "${STATE}" = "FAILED" ]; then
              echo "Central deployment FAILED"
              echo "${STATUS_JSON}"
              exit 1
            fi

            sleep 30
          done

          echo "Timed out waiting for Central Portal publish"
          exit 1

      - name: Create GitHub Release
        if: github.event_name == 'push' && !contains(github.ref, '-rc')
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Pre-release (RC)
        if: github.event_name == 'push' && contains(github.ref, '-rc')
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
