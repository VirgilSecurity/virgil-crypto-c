name: Release Go

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.17.3)'
        required: true
        type: string

env:
  GO_VERSION: '1.21'
  PYTHON_VERSION: '3.11'

jobs:
  # ---------------------------------------------------------------------------
  # Build matrix: cross-compile C static libraries for each target
  # ---------------------------------------------------------------------------
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux_amd64
            runner: ubuntu-latest
            cmake_extra: >-
              -DED25519_AMD64_RADIX_64_24K=ON
              -DED25519_REF10=OFF
            run_tests: true

          - target: linux_arm64
            runner: ubuntu-latest
            cmake_extra: >-
              -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc
              -DCMAKE_SYSTEM_NAME=Linux
              -DCMAKE_SYSTEM_PROCESSOR=aarch64
            cross_packages: gcc-aarch64-linux-gnu
            run_tests: false

          - target: darwin_amd64
            runner: macos-14
            cmake_extra: >-
              -DCMAKE_OSX_ARCHITECTURES=x86_64
            run_tests: false

          - target: darwin_arm64
            runner: macos-14
            cmake_extra: >-
              -DCMAKE_OSX_ARCHITECTURES=arm64
            run_tests: true

          - target: windows_amd64
            runner: ubuntu-latest
            cmake_extra: >-
              -DCMAKE_TOOLCHAIN_FILE=configs/toolchain-mingw-x86_64.cmake
            cross_packages: gcc-mingw-w64-x86-64
            run_tests: false

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Go
        if: matrix.run_tests
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install cross-compilation toolchain
        if: matrix.cross_packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.cross_packages }}

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Setup Python virtual environment
        run: python3 -m venv .venv

      - name: Build native libraries
        run: |
          source .venv/bin/activate
          cmake -Cconfigs/go-config.cmake \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/wrappers/go/pkg/${{ matrix.target }}" \
                -DENABLE_CLANGFORMAT=OFF \
                -DVIRGIL_POST_QUANTUM=ON \
                ${{ matrix.cmake_extra }} \
                -Bbuild -S.
          cmake --build build --target install -j$(nproc 2>/dev/null || sysctl -n hw.physicalcpu)

      - name: Run Go tests
        if: matrix.run_tests
        working-directory: wrappers/go
        run: go test ./...

      - name: Upload built libraries
        uses: actions/upload-artifact@v4
        with:
          name: go-libs-${{ matrix.target }}
          path: wrappers/go/pkg/${{ matrix.target }}/
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Commit libraries to the repo and create Go module tag
  # ---------------------------------------------------------------------------
  commit-and-tag:
    name: Commit Libraries & Tag Go Module
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'develop' || github.ref }}
          lfs: true
          fetch-depth: 0

      - name: Setup Git LFS
        run: |
          git lfs install
          git lfs track "wrappers/go/pkg/**/*.a"

      - name: Download all built libraries
        uses: actions/download-artifact@v4
        with:
          pattern: go-libs-*
          path: wrappers/go/pkg/
          merge-multiple: false

      - name: Restructure artifacts
        run: |
          cd wrappers/go/pkg
          for dir in go-libs-*; do
            target="${dir#go-libs-}"
            if [ -d "$target" ]; then
              rm -rf "$target"
            fi
            mv "$dir" "$target"
          done
          echo "Installed targets:"
          ls -la
          echo "Library files:"
          find . -name '*.a' | sort

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "go_module_tag=wrappers/go/$TAG" >> "$GITHUB_OUTPUT"

      - name: Commit libraries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add wrappers/go/pkg/ .gitattributes
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore(go): update pre-built static libraries for ${{ steps.version.outputs.tag }}"
          git push origin HEAD

      - name: Create Go module tag
        run: |
          git tag "${{ steps.version.outputs.go_module_tag }}"
          git push origin "${{ steps.version.outputs.go_module_tag }}"
