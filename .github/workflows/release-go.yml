name: Release Go

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.17.3)'
        required: true
        type: string

jobs:
  build:
    uses: ./.github/workflows/build-go.yml
    with:
      upload_artifacts: true

  commit-and-tag:
    name: Commit Libraries & Tag Go Module
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: develop
          lfs: true
          fetch-depth: 0

      - name: Setup Git LFS
        run: |
          git lfs install
          git lfs track "wrappers/go/pkg/**/*.a"

      - name: Download all built libraries
        uses: actions/download-artifact@v4
        with:
          pattern: go-libs-*
          path: wrappers/go/pkg/
          merge-multiple: false

      - name: Restructure artifacts
        run: |
          cd wrappers/go/pkg
          for dir in go-libs-*; do
            target="${dir#go-libs-}"
            if [ -d "$target" ]; then
              rm -rf "$target"
            fi
            mv "$dir" "$target"
          done
          echo "Installed targets:"
          ls -la
          echo "Library files:"
          find . -name '*.a' | sort

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "go_module_tag=wrappers/go/$TAG" >> "$GITHUB_OUTPUT"
          echo "temp_branch=go-libs/$TAG" >> "$GITHUB_OUTPUT"

      - name: Commit libraries to temp branch and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f wrappers/go/pkg/ .gitattributes
          if git diff --cached --quiet; then
            echo "No library changes — tagging current HEAD"
          else
            TEMP_BRANCH="${{ steps.version.outputs.temp_branch }}"
            git checkout -b "$TEMP_BRANCH"
            git commit -m "chore(go): update pre-built static libraries for ${{ steps.version.outputs.tag }}"
            git push origin "$TEMP_BRANCH"
          fi
          git tag "${{ steps.version.outputs.go_module_tag }}"
          git push origin "refs/tags/${{ steps.version.outputs.go_module_tag }}"

      - name: Delete temp branch
        if: always()
        run: |
          TEMP_BRANCH="${{ steps.version.outputs.temp_branch }}"
          git push origin --delete "$TEMP_BRANCH" 2>/dev/null || true
