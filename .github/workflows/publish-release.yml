name: Publish Java/Android Release

on:
  push:
    tags:
      - 'v*.*.*'           # Release tags (v1.2.3)
      - 'v*.*.*-rc*'       # Release candidate tags (v1.2.3-rc1)
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release'
        required: true
        type: string

jobs:
  # Build all binaries first
  build:
    name: Build Binaries
    uses: ./.github/workflows/build-java-binaries.yml

  build-php:
    name: Build PHP Packages
    uses: ./.github/workflows/build-php-binaries.yml

  # Publish JVM artifacts to Maven Central
  publish-jvm-release:
    name: Publish JVM Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'maven'
          server-id: central
          server-username: OSSRH_USERNAME
          server-password: OSSRH_PASSWORD

      - name: Download all JVM binaries
        uses: actions/download-artifact@v4
        with:
          pattern: java-binaries-*
          path: wrappers/java/binaries/
          merge-multiple: false

      - name: Restructure binaries
        run: |
          cd wrappers/java/binaries
          mkdir -p linux macos_x86_64 macos_arm64 windows
          [ -d java-binaries-linux ] && mv java-binaries-linux/lib linux/ || true
          [ -d java-binaries-macos-x86_64 ] && mv java-binaries-macos-x86_64/lib macos_x86_64/ || true
          [ -d java-binaries-macos-arm64 ] && mv java-binaries-macos-arm64/lib macos_arm64/ || true
          [ -d java-binaries-windows ] && mv java-binaries-windows/lib windows/ || true
          rm -rf java-binaries-*

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --list-secret-keys --keyid-format LONG

      - name: Verify version matches tag
        if: github.event_name == 'push'
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          POM_VERSION=$(grep -m 1 '<version>' wrappers/java/pom.xml | sed 's/.*<version>\(.*\)<\/version>.*/\1/' | tr -d '[:space:]')
          echo "Tag version: $TAG_VERSION"
          echo "POM version: $POM_VERSION"
          # Remove -SNAPSHOT suffix for comparison
          POM_VERSION_BASE=${POM_VERSION%-SNAPSHOT}
          if [ "$TAG_VERSION" != "$POM_VERSION_BASE" ]; then
            echo "ERROR: Tag version ($TAG_VERSION) doesn't match POM version ($POM_VERSION_BASE)"
            exit 1
          fi

      - name: Deploy to Maven Central
        working-directory: wrappers/java
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          ./mvnw clean deploy \
            -P foundation,phe,pythia,ratchet,release \
            -Dgpg.passphrase="${GPG_PASSPHRASE}" \
            -DskipTests

  # Publish Android artifacts to Maven Central
  publish-android-release:
    name: Publish Android Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'  # Android requires Java 17 for AGP 8+
          cache: 'gradle'

      - name: Download all Android binaries
        uses: actions/download-artifact@v4
        with:
          pattern: android-binaries-*
          path: wrappers/java/binaries/android/lib/
          merge-multiple: false

      - name: Restructure Android binaries
        run: |
          cd wrappers/java/binaries/android/lib
          mkdir -p x86 x86_64 armeabi-v7a arm64-v8a
          [ -d android-binaries-x86 ] && mv android-binaries-x86/* x86/ || true
          [ -d android-binaries-x86_64 ] && mv android-binaries-x86_64/* x86_64/ || true
          [ -d android-binaries-armeabi-v7a ] && mv android-binaries-armeabi-v7a/* armeabi-v7a/ || true
          [ -d android-binaries-arm64-v8a ] && mv android-binaries-arm64-v8a/* arm64-v8a/ || true
          rm -rf android-binaries-*
          ls -la

      - name: Verify version matches tag
        if: github.event_name == 'push'
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          GRADLE_VERSION=$(grep 'version' wrappers/java/android/build.gradle | head -1 | sed 's/.*version "\(.*\)".*/\1/' | tr -d '[:space:]')
          echo "Tag version: $TAG_VERSION"
          echo "Gradle version: $GRADLE_VERSION"
          # Remove -SNAPSHOT suffix for comparison
          GRADLE_VERSION_BASE=${GRADLE_VERSION%-SNAPSHOT}
          if [ "$TAG_VERSION" != "$GRADLE_VERSION_BASE" ]; then
            echo "ERROR: Tag version ($TAG_VERSION) doesn't match Gradle version ($GRADLE_VERSION_BASE)"
            exit 1
          fi

      - name: Publish to Maven Central
        working-directory: wrappers/java/android
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          ./gradlew publishAllPublicationsToMavenRepository \
            -PossrhUsername="${OSSRH_USERNAME}" \
            -PossrhPassword="${OSSRH_PASSWORD}" \
            -PsigningKey="${SIGNING_KEY}" \
            -PsigningPassword="${SIGNING_PASSWORD}" \
            --no-daemon \
            --stacktrace

      - name: Create GitHub Release
        if: github.event_name == 'push' && !contains(github.ref, '-rc')
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Pre-release (RC)
        if: github.event_name == 'push' && contains(github.ref, '-rc')
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-php-assets:
    name: Publish PHP Assets
    if: github.event_name == 'push'
    needs: [build-php, publish-android-release]
    runs-on: ubuntu-latest
    steps:
      - name: Download all PHP artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: php-*
          path: dist
          merge-multiple: true

      - name: Upload PHP assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.zip
            dist/**/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
