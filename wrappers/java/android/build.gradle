// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.2'
        classpath "androidx.benchmark:benchmark-gradle-plugin:1.2.2"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

// Shared Android SDK versions for all modules.
ext {
    androidCompileSdk = 34
    androidMinSdk = 21
    androidTargetSdk = 34
}

allprojects {
    repositories {
        google()
        mavenCentral()
        mavenLocal()
    }
    group "com.virgilsecurity.crypto"
    version "0.19.0-rc.6"

    def authentication_username = hasProperty('authentication_username') ? authentication_username : System.getenv('authentication_username')
    def authentication_password = hasProperty('authentication_password') ? authentication_password : System.getenv('authentication_password')
}

subprojects { subproj ->
    // Central Portal uploads expect a Maven-repository-layout bundle.
    // We publish all Android modules to a local file-based repository, then zip it for upload.
    subproj.plugins.withId('maven-publish') {
        subproj.publishing {
            repositories {
                maven {
                    name = 'centralBundle'
                    url = uri("${rootProject.buildDir}/central-bundle-repo")
                }
            }
        }
    }

    // Avoid publishing Gradle module metadata (adds extra files that may not be signed).
    subproj.tasks.withType(org.gradle.api.publish.tasks.GenerateModuleMetadata).configureEach {
        enabled = false
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

// Helper task for CI to print the effective Gradle project version.
tasks.register('printVersion') {
    doLast {
        println project.version
    }
}
