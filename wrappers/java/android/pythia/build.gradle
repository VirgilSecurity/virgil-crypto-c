plugins {
    id 'com.android.library'
    id 'maven-publish'
    id 'signing'
}
import java.util.zip.ZipFile

android {
    compileSdk rootProject.ext.androidCompileSdk
    namespace 'com.virgilsecurity.crypto.pythia'

    defaultConfig {
        minSdkVersion rootProject.ext.androidMinSdk
        targetSdkVersion rootProject.ext.androidTargetSdk
        consumerProguardFiles 'proguard-rules.txt'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets {
        main {
            java.srcDirs 'src/main/java'
            java.srcDirs '../../pythia/src/main/java'
            jniLibs.srcDirs 'src/main/jniLibs'
            jniLibs.srcDirs 'src/generated/jniLibs'
            res.srcDirs "src/main/res"
        }
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
            withJavadocJar()
        }
    }
}

dependencies {
    api project(':common')

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'commons-lang:commons-lang:2.6'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

// Copy *.so files from binaries/ folder to native-libs folder
task copyNativeLibs(type: Copy) {
    from ('../../binaries/android/lib/'){
        include '**/*pythia*.so'
    }
    into 'src/generated/jniLibs'
    rename { filename ->
        filename.replace '_java', ''
    }
}

preBuild.dependsOn 'copyNativeLibs'

// On "gradle clean" also reverse the copying of the native libraries
clean.dependsOn 'cleanCopyNativeLibs'

task verifyReleaseAarContents {
    dependsOn 'bundleReleaseAar'
    doLast {
        File aarFile = file("$buildDir/outputs/aar/${project.name}-release.aar")
        if (!aarFile.exists()) {
            throw new GradleException("Expected AAR is missing: ${aarFile}")
        }
        ZipFile aarZip = new ZipFile(aarFile)
        try {
            def classesEntry = aarZip.getEntry('classes.jar')
            if (classesEntry == null || classesEntry.size <= 22L) {
                throw new GradleException("AAR classes.jar is empty for ${project.path}.")
            }
            def hasJni = aarZip.entries().any { it.name.startsWith('jni/') && it.name.endsWith('.so') }
            if (!hasJni) {
                throw new GradleException("AAR has no JNI .so files for ${project.path}.")
            }
        } finally {
            aarZip.close()
        }
    }
}

afterEvaluate {
    tasks.matching { it.name == 'publishReleasePublicationToCentralBundleRepository' || it.name == 'publishReleasePublicationToMavenLocal' }.configureEach {
        dependsOn verifyReleaseAarContents
    }

    publishing {
        publications {
            release(MavenPublication) {
                from components.release

                // Split artifacts: JVM publishes pythia, Android publishes pythia-android.
                groupId = 'com.virgilsecurity.crypto'
                artifactId = 'pythia-android'
                version = project.version

                pom {
                    name = 'Virgil Security Crypto Pythia'
                    description = 'Cryptographic background for the Pythia PRF Service.'
                    url = 'https://www.virgilsecurity.com/'
                    licenses {
                        license {
                            name = 'Virgil Security, Inc. license'
                            url = 'https://github.com/VirgilSecurity/virgil-crypto-c/blob/master/LICENSE'
                        }
                    }
                    developers {
                        developer {
                            id = 'virgil-security-inc'
                            name = 'Virgil Security, Inc.'
                            email = 'support@virgilsecurity.com'
                            organizationUrl = 'https://www.virgilsecurity.com/'
                        }
                    }
                    scm {
                        connection = 'scm:git:git@github.com:VirgilSecurity/virgil-crypto-c.git'
                        developerConnection = 'scm:git:git@github.com:VirgilSecurity/virgil-crypto-c.git'
                        url = 'https://github.com/VirgilSecurity/virgil-crypto-c'
                    }
                }
            }
        }
    }

    signing {
        def signingKey = findProperty('signingKey') ?: System.getenv('SIGNING_KEY')
        def signingPassword = findProperty('signingPassword') ?: System.getenv('SIGNING_PASSWORD')

        if (signingKey && signingPassword) {
            useInMemoryPgpKeys(signingKey, signingPassword)
            sign publishing.publications.release
        }
    }
}
