plugins {
    id 'com.android.library'
    id 'maven-publish'
    id 'signing'
}

android {
    compileSdk rootProject.ext.androidCompileSdk
    namespace 'com.virgilsecurity.crypto.common'

    defaultConfig {
        minSdkVersion rootProject.ext.androidMinSdk
        targetSdkVersion rootProject.ext.androidTargetSdk
        consumerProguardFiles 'proguard-rules.txt'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
            withJavadocJar()
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release

                // Use same artifactId as JVM for unified dependency resolution
                groupId = 'com.virgilsecurity.crypto'
                artifactId = 'common'
                version = project.version

                pom {
                    name = 'Virgil Security Crypto Common'
                    description = 'This library is designed to be small, flexible and convenient wrapper for a variety crypto algorithms. So it can be used in a small micro controller as well as in a high load server application.'
                    url = 'https://www.virgilsecurity.com/'
                    licenses {
                        license {
                            name = 'Virgil Security, Inc. license'
                            url = 'https://github.com/VirgilSecurity/virgil-crypto-c/blob/master/LICENSE'
                        }
                    }
                    developers {
                        developer {
                            id = 'andrii-iakovenko'
                            name = 'Andrii Iakovenko'
                            email = 'iakovenko.andrii@gmail.com'
                            organizationUrl = 'https://www.virgilsecurity.com/'
                        }
                    }
                    scm {
                        connection = 'scm:git:git@github.com:VirgilSecurity/virgil-crypto-c.git'
                        developerConnection = 'scm:git:git@github.com:VirgilSecurity/virgil-crypto-c.git'
                        url = 'https://github.com/VirgilSecurity/virgil-crypto-c'
                    }
                }
            }
        }
    }

    signing {
        def signingKey = findProperty('signingKey') ?: System.getenv('SIGNING_KEY')
        def signingPassword = findProperty('signingPassword') ?: System.getenv('SIGNING_PASSWORD')

        if (signingKey && signingPassword) {
            useInMemoryPgpKeys(signingKey, signingPassword)
        }
        sign publishing.publications.release
    }
}
