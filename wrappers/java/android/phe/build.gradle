plugins {
    id 'com.android.library'
    id 'maven-publish'
    id 'signing'
}

android {
    compileSdk 34
    namespace 'com.virgilsecurity.crypto.phe'

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 34
        consumerProguardFiles 'proguard-rules.txt'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets {
        main {
            java.srcDirs 'src/main/java'
            java.srcDirs 'src/generated/java'
            jniLibs.srcDirs 'src/main/jniLibs'
            jniLibs.srcDirs 'src/generated/jniLibs'
            res.srcDirs "src/main/res"
        }
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
            withJavadocJar()
        }
    }
}

dependencies {
    api project(':common')
    api project(':foundation')

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'commons-lang:commons-lang:2.6'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

// Copy *.java files from generated Java folder
task copySources(type: Copy) {
    from ('../../phe/src/main/java/'){
        include '**/*.java'
    }
    into 'src/generated/java'
}

// Copy *.so files from binaries/ folder to native-libs folder
task copyNativeLibs(type: Copy) {
    from ('../../binaries/android/lib/'){
        include '**/*phe*.so'
    }
    into 'src/generated/jniLibs'
    rename { filename ->
        filename.replace '_java', ''
    }
}

task clearSources(type: Delete) {
    delete 'src/generated/java', '*'
    followSymlinks = true
}

preBuild.dependsOn 'clearSources'
preBuild.dependsOn 'copySources'
preBuild.dependsOn 'copyNativeLibs'

// On "gradle clean" also reverse the copying of the native libraries
clean.dependsOn 'cleanCopyNativeLibs'

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release

                // Use same artifactId as JVM for unified dependency resolution
                groupId = 'com.virgilsecurity.crypto'
                artifactId = 'phe'
                version = project.version

                pom {
                    name = 'Virgil Security Crypto PHE'
                    description = 'Cryptographic background for the Password-Hardened Encryption (PHE) protocol that provides developers with a technology to protect users passwords from offline attacks and make stolen passwords useless even if your database has been compromised.'
                    url = 'https://www.virgilsecurity.com/'
                    licenses {
                        license {
                            name = 'Virgil Security, Inc. license'
                            url = 'https://github.com/VirgilSecurity/virgil-crypto-c/blob/master/LICENSE'
                        }
                    }
                    developers {
                        developer {
                            id = 'andrii-iakovenko'
                            name = 'Andrii Iakovenko'
                            email = 'iakovenko.andrii@gmail.com'
                            organizationUrl = 'https://www.virgilsecurity.com/'
                        }
                    }
                    scm {
                        connection = 'scm:git:git@github.com:VirgilSecurity/virgil-crypto-c.git'
                        developerConnection = 'scm:git:git@github.com:VirgilSecurity/virgil-crypto-c.git'
                        url = 'https://github.com/VirgilSecurity/virgil-crypto-c'
                    }
                }
            }
        }

        repositories {
            maven {
                def releasesRepoUrl = "https://s01.oss.sonatype.org/service/local/staging/deploy/maven2/"
                def snapshotsRepoUrl = "https://s01.oss.sonatype.org/content/repositories/snapshots"
                url = version.endsWith('SNAPSHOT') ? snapshotsRepoUrl : releasesRepoUrl
                credentials {
                    username = findProperty('ossrhUsername') ?: System.getenv('OSSRH_USERNAME')
                    password = findProperty('ossrhPassword') ?: System.getenv('OSSRH_PASSWORD')
                }
            }
        }
    }

    signing {
        def signingKey = findProperty('signingKey') ?: System.getenv('SIGNING_KEY')
        def signingPassword = findProperty('signingPassword') ?: System.getenv('SIGNING_PASSWORD')

        if (signingKey && signingPassword) {
            useInMemoryPgpKeys(signingKey, signingPassword)
        }
        sign publishing.publications.release
    }
}
